# KI-Code-Review für Pull Requests (Claude Code GitHub Action)
#
# - Bei jedem neuen / aktualisierten Pull Request reviewt Claude die Änderungen
#   und schreibt Kommentare direkt an die betroffenen Codezeilen.
# - Zusätzlich: In PR- oder Issue-Kommentaren "@claude <Frage>" schreiben,
#   dann antwortet Claude dort.
#
# Einrichtung (einmalig):
#   1. GitHub-App "Claude" für dieses Repo installieren: https://github.com/apps/claude
#   2. Im Repo unter Settings → Secrets and variables → Actions EIN Secret anlegen:
#        CLAUDE_CODE_OAUTH_TOKEN  (Claude-Abo; Token im Terminal mit `claude setup-token` erzeugen)
#      oder
#        ANTHROPIC_API_KEY        (API-Key von console.anthropic.com, Abrechnung nach Verbrauch)

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    # Automatisches Review bei PRs (Entwürfe werden übersprungen)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Du reviewst einen Pull Request des Studienprojekts "Bragirium"
            (SvelteKit 3 mit Svelte 5 Runes, Supabase für Login/Datenbank, TMDB-API für Filmdaten).
            Antworte auf Deutsch.

            Prüfe die Änderungen dieses PRs auf:
            - Fehler und Bugs (Logik, Randfälle, fehlende Fehlerbehandlung)
            - Sicherheit (Secrets im Code, Supabase-RLS, Eingabevalidierung, offene Redirects)
            - Urheberrecht (keine illegalen Streams oder fremden Inhalte ohne Erlaubnis)
            - Verständlichkeit und Struktur des Codes
            - Usability (klares Feedback, Barrierefreiheit)

            Kommentiere konkrete Probleme als Inline-Kommentar an der betroffenen Zeile
            (mcp__github_inline_comment__create_inline_comment). Fasse am Schluss mit
            `gh pr comment` kurz zusammen: Was ist gut, was muss geändert werden, was ist optional.
            Keine Kommentare zu reinen Geschmacksfragen.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    # Antwortet, wenn jemand in einem Kommentar "@claude" schreibt
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
